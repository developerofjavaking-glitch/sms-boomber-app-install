<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Download</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .download-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 100%;
        }
        .download-card h2 {
            margin-bottom: 10px;
            font-size: 22px;
            color: #38bdf8;
        }
        .download-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .download-btn {
            display: inline-block;
            background: #22c55e;
            color: #white;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
        .download-btn:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="download-card">
        <h2>SMS App Download</h2>
        <p>ক্লিক করে আপনার অ্যান্ড্রয়েড ডিভাইসে অ্যাপটি ডাউনলোড করুন।</p>
        
        <!-- এখানে href-এ আপনার জিপোজিটরি থেকে APK ফাইলের ডিরেক্ট লিঙ্ক বসিয়ে দেবেন -->
        <a href="./sms.apk" class="download-btn" download>📥 Download SMS APK</a>
    </div>

</body>
</html>
